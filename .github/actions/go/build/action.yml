name: Docker build and push
description: Builds a Docker image, and pushes it to Docker Hub when push is "true".

inputs:
  context:
    description: Folder that contains the Dockerfile, for example "go".
    required: true
  image:
    description: Image name and tag, for example "hello-world:go.12".
    required: true
  push:
    description: Set to "true" to push the image to Docker Hub.
    required: false
    default: "false"
  username:
    description: Docker Hub username. Needed only when push is "true".
    required: false
  token:
    description: Docker Hub access token. Needed only when push is "true".
    required: false

runs:
  using: composite
  steps:
    - name: Build the image
      shell: bash
      run: docker image build -t "$IMAGE" "$CONTEXT"
      env:
        IMAGE: ${{ inputs.image }}
        CONTEXT: ${{ inputs.context }}

    - name: Log in to Docker Hub
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}

    - name: Push the image
      if: inputs.push == 'true'
      shell: bash
      run: docker image push "$IMAGE"
      env:
        IMAGE: ${{ inputs.image }}
